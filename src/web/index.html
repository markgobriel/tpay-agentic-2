<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Rhythm</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18342d;background:#f5f5ee}body{margin:0}[hidden]{display:none!important}.shell{max-width:980px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{font-weight:800;font-size:22px}.pill,.status{background:#dcecdf;color:#17603c;padding:7px 11px;border-radius:99px;font-size:13px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.card{background:#fff;border:1px solid #e0e5dc;border-radius:18px;padding:25px;box-shadow:0 6px 20px #18342d0a}h1{font-size:40px;line-height:1.05;margin:0 0 12px}h2{font-size:20px;margin:0 0 20px}h3{font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin:24px 0 8px}p{color:#5e7167;line-height:1.5}.today{background:#183e34;color:#fff}.today p{color:#c9ddd2}.empty{border:1px dashed #b9cfc0;border-radius:12px;padding:18px;color:#d8e8dd}label{display:block;font-weight:650;font-size:14px;margin:15px 0 6px}input,select{box-sizing:border-box;width:100%;border:1px solid #cbd8ce;border-radius:9px;padding:11px;font:inherit;background:#fff}button{margin-top:20px;border:0;border-radius:9px;background:#247650;color:#fff;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer}button:hover,button:focus-visible{background:#185d3d;outline:3px solid #b6dfc5;outline-offset:2px}.routine{margin-top:8px;padding:13px;border-radius:10px;background:#eff6ef;color:#18342d}.routine small{display:block;color:#587065;margin-top:4px}.routine button{margin-top:10px;background:#386957;padding:8px 11px;font-size:13px}.status{display:inline-block;margin-bottom:8px}.due{background:#f4e7c4;color:#6b4d00}.paused{background:#e6e4e1;color:#4f4b45}@media(max-width:700px){.shell{padding:25px 16px}.grid{grid-template-columns:1fr}h1{font-size:34px}}
</style></head><body><main class="shell"><header><span class="brand">Home Rhythm</span><span class="pill">Private household planner</span></header><section class="grid"><article class="card today"><h1>Today and upcoming</h1><p>See what needs attention now, what is coming, and anything you have paused.</p><div id="today" class="empty">No routines yet. Add one to begin.</div></article><section class="card"><h2>Add a routine</h2><form id="form"><label for="name">What needs doing?</label><input id="name" required placeholder="e.g. Empty kitchen bin"><label for="area">Where?</label><input id="area" required placeholder="Kitchen"><label for="kind">How often?</label><select id="kind"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="interval">Every few days</option></select><label for="days" id="daysLabel" hidden>Number of days</label><input id="days" type="number" min="1" value="3" hidden><button type="submit">Add routine</button><p id="message" role="status"></p></form></section></section></main><script>
const form=document.querySelector('#form'),routineName=document.querySelector('#name'),area=document.querySelector('#area'),kind=document.querySelector('#kind'),days=document.querySelector('#days'),daysLabel=document.querySelector('#daysLabel'),today=document.querySelector('#today'),message=document.querySelector('#message');
const labels={due:'Due now',upcoming:'Upcoming',paused:'Paused'};
const render=items=>{if(!items.length){today.className='empty';today.textContent='No routines yet. Add one to begin.';return}today.className='';today.replaceChildren(...['due','upcoming','paused'].flatMap(status=>{const matches=items.filter(item=>item.status===status);if(!matches.length)return[];const heading=document.createElement('h3');heading.textContent=labels[status];return[heading,...matches.map(item=>{const card=document.createElement('article');card.className='routine';const badge=document.createElement('span');badge.className='status '+status;badge.textContent=labels[status];const title=document.createElement('strong');title.textContent=item.name;const detail=document.createElement('small');detail.textContent=item.area+' · '+item.schedule.kind+(item.schedule.kind==='interval'?' every '+item.schedule.days+' days':'')+' · Next due '+item.nextDue;const history=document.createElement('small');history.textContent=item.latestCompletion?'Last completed '+item.latestCompletion:'No completions recorded yet.';const toggle=document.createElement('button');toggle.type='button';toggle.textContent=item.active?'Pause routine':'Resume routine';toggle.onclick=async()=>{const response=await fetch('/api/routines/'+item.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({active:!item.active})});if(!response.ok){message.textContent=(await response.json()).error;return}message.textContent=item.active?'Routine paused.':'Routine resumed.';await load()};const complete=document.createElement('button');complete.type='button';complete.textContent='Mark complete';complete.onclick=async()=>{const response=await fetch('/api/routines/'+item.id+'/completions',{method:'POST'});if(!response.ok){message.textContent=(await response.json()).error;return}message.textContent='Routine completed.';await load()};card.append(badge,title,detail,history);if(item.status==='due')card.append(complete);card.append(toggle);return card})]}));};
const load=async()=>{const response=await fetch('/api/routines');if(!response.ok){message.textContent='Could not load routines.';return}render(await response.json())};
kind.onchange=()=>{const show=kind.value==='interval';days.hidden=daysLabel.hidden=!show};
form.onsubmit=async event=>{event.preventDefault();message.textContent='Adding routine…';const response=await fetch('/api/routines',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:routineName.value,area:area.value,kind:kind.value,days:days.value,createdOn:new Date().toISOString().slice(0,10)})});const data=await response.json();if(!response.ok){message.textContent=data.error;return}message.textContent='Routine added.';form.reset();await load()};
load();
</script></body></html>
