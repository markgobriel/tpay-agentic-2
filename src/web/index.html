<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Rhythm</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18342d;background:#f5f5ee}body{margin:0}[hidden]{display:none!important}.shell{max-width:980px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{font-weight:800;font-size:22px}.pill{background:#dcecdf;color:#17603c;padding:7px 11px;border-radius:99px;font-size:13px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.card{background:#fff;border:1px solid #e0e5dc;border-radius:18px;padding:25px;box-shadow:0 6px 20px #18342d0a}h1{font-size:40px;line-height:1.05;margin:0 0 12px}h2{font-size:20px;margin:0 0 20px}p{color:#5e7167;line-height:1.5}.today{background:#183e34;color:#fff}.today p{color:#c9ddd2}.empty{border:1px dashed #b9cfc0;border-radius:12px;padding:18px;color:#d8e8dd}label{display:block;font-weight:650;font-size:14px;margin:15px 0 6px}input,select{box-sizing:border-box;width:100%;border:1px solid #cbd8ce;border-radius:9px;padding:11px;font:inherit;background:#fff}button{margin-top:20px;border:0;border-radius:9px;background:#247650;color:#fff;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer}button:hover{background:#185d3d}.routine{margin-top:12px;padding:13px;border-radius:10px;background:#eff6ef}.routine small{display:block;color:#587065;margin-top:4px}@media(max-width:700px){.shell{padding:25px 16px}.grid{grid-template-columns:1fr}h1{font-size:34px}}
</style></head><body><main class="shell"><header><span class="brand">Home Rhythm</span><span class="pill">Private household planner</span></header><section class="grid"><article class="card today"><h1>A calmer way to keep home routines moving.</h1><p>Start with one small routine. Home Rhythm will keep its timing clear.</p><div id="today" class="empty">No routines yet. Add one to begin.</div></article><section class="card"><h2>Add a routine</h2><form id="form"><label for="name">What needs doing?</label><input id="name" required placeholder="e.g. Empty kitchen bin"><label for="area">Where?</label><input id="area" required placeholder="Kitchen"><label for="kind">How often?</label><select id="kind"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="interval">Every few days</option></select><label for="days" id="daysLabel" hidden>Number of days</label><input id="days" type="number" min="1" value="3" hidden><button type="submit">Add routine</button><p id="message" role="status"></p></form></section></section></main><script>
const form=document.querySelector('#form'),routineName=document.querySelector('#name'),area=document.querySelector('#area'),kind=document.querySelector('#kind'),days=document.querySelector('#days'),daysLabel=document.querySelector('#daysLabel'),today=document.querySelector('#today'),message=document.querySelector('#message');
kind.onchange=()=>{const show=kind.value==='interval';days.hidden=daysLabel.hidden=!show};
form.onsubmit=async event=>{event.preventDefault();message.textContent='Adding routine…';const response=await fetch('/api/routines',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:routineName.value,area:area.value,kind:kind.value,days:days.value,createdOn:new Date().toISOString().slice(0,10)})});const data=await response.json();if(!response.ok){message.textContent=data.error;return}today.className='';const item=document.createElement('div');item.className='routine';const title=document.createElement('strong');title.textContent=data.name;const detail=document.createElement('small');detail.textContent=data.area+' · Next due '+data.nextDue;item.append(title,detail);today.replaceChildren(item);message.textContent='Routine added.';form.reset();};
</script></body></html>
